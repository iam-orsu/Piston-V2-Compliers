version: '3.2'

services:
    api:
        build: api
        container_name: piston_api
        # C7: Dropped 'privileged: true' — it disabled all Linux security primitives.
        # Isolate needs SYS_ADMIN for mount namespaces and cgroup control.
        # These targeted capabilities replace the blanket privileged flag.
        cap_add:
            - SYS_ADMIN
            - NET_ADMIN
        security_opt:
            - seccomp=unconfined   # isolate requires unrestricted seccomp
            - apparmor=unconfined  # isolate manages its own sandboxing
        restart: always
        ports:
            - 2000:2000
        volumes:
            - ./data/piston/packages:/piston/packages
        environment:
            - PISTON_REPO_URL=http://repo:8000/index

    repo: # Local testing of packages
        build: repo
        container_name: piston_repo
        command: ['--no-build'] # Don't build anything
        volumes:
            - .:/piston
