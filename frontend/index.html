<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piston IDE</title>
    <!-- M6: All JS/CSS served locally — no CDN dependency at runtime (air-gap safe) -->
    <link rel="stylesheet" href="/vendor/xterm.css">
    <style>
        :root {
            --bg-0: #0d1117;
            --bg-1: #161b22;
            --bg-2: #21262d;
            --border: #30363d;
            --text: #c9d1d9;
            --text-dim: #8b949e;
            --text-muted: #484f58;
            --accent: #58a6ff;
            --green: #3fb950;
            --green-dark: #238636;
            --red: #f85149;
            --yellow: #d29922;
            --purple: #bc8cff;
            --radius: 6px;
            --mono: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-0);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ── Header ── */
        .header {
            background: var(--bg-1);
            border-bottom: 1px solid var(--border);
            height: 52px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            z-index: 10;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 15px;
            white-space: nowrap;
            color: var(--text);
        }

        .logo-icon {
            width: 28px; height: 28px;
            background: linear-gradient(135deg, #58a6ff, #bc8cff);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .sep { width: 1px; height: 24px; background: var(--border); flex-shrink: 0; }

        .controls { display: flex; align-items: center; gap: 8px; flex: 1; }

        select {
            background: var(--bg-2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 10px;
            border-radius: var(--radius);
            font-size: 13px;
            outline: none;
            transition: border-color 0.15s;
            cursor: pointer;
            min-width: 140px;
        }
        select:hover { border-color: var(--accent); }
        select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(88,166,255,0.15); }

        .version-badge {
            background: var(--bg-2);
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-family: var(--mono);
            white-space: nowrap;
        }

        .spacer { flex: 1; }

        .icon-btn {
            background: var(--bg-2);
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 6px 12px;
            border-radius: var(--radius);
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .icon-btn:hover { border-color: var(--accent); color: var(--text); }

        .run-btn {
            background: var(--green-dark);
            border: 1px solid rgba(63,185,80,0.4);
            color: #fff;
            padding: 7px 20px;
            border-radius: var(--radius);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 7px;
            transition: background 0.15s;
            white-space: nowrap;
        }
        .run-btn:hover { background: #2ea043; }
        .run-btn:disabled { background: var(--bg-2); border-color: var(--border); color: var(--text-muted); cursor: not-allowed; }
        .run-btn .spinner { display: none; }
        .run-btn.loading .run-icon { display: none; }
        .run-btn.loading .spinner { display: block; }

        .kill-btn {
            background: rgba(248,81,73,0.1);
            border: 1px solid rgba(248,81,73,0.4);
            color: var(--red);
            padding: 7px 16px;
            border-radius: var(--radius);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: none;
            align-items: center;
            gap: 6px;
            transition: background 0.15s;
            white-space: nowrap;
        }
        .kill-btn:hover { background: rgba(248,81,73,0.2); }
        .kill-btn.visible { display: flex; }

        .spinner {
            width: 14px; height: 14px;
            border: 2px solid rgba(255,255,255,0.25);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Main Layout ── */
        .main {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        /* ── Editor Panel ── */
        .editor-panel {
            flex: 6;
            min-width: 0;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
        }

        .editor-titlebar {
            background: var(--bg-1);
            border-bottom: 1px solid var(--border);
            height: 36px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .file-tab {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 14px;
            height: 100%;
            font-size: 12px;
            color: var(--text-dim);
            border-bottom: 2px solid transparent;
        }
        .file-tab.active { color: var(--text); border-bottom-color: var(--accent); }
        .file-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

        #editor { flex: 1; min-height: 0; }

        /* ── Terminal Panel ── */
        .terminal-panel {
            flex: 4;
            min-width: 0;
            display: flex;
            flex-direction: column;
            background: #0d1117;
        }

        .terminal-titlebar {
            background: var(--bg-1);
            border-bottom: 1px solid var(--border);
            height: 36px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .term-tab {
            background: none;
            border: none;
            color: var(--text-dim);
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .term-tab:hover { background: var(--bg-2); color: var(--text); }
        .term-tab.active { background: var(--bg-2); color: var(--text); }

        .tab-spacer { flex: 1; }

        .clear-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 11px;
            cursor: pointer;
            padding: 3px 8px;
            border-radius: 4px;
            transition: all 0.15s;
        }
        .clear-btn:hover { color: var(--text-dim); background: var(--bg-2); }

        .terminal-body {
            flex: 1;
            min-height: 0;
            position: relative;
            overflow: hidden;
        }

        /* xterm.js container — must fill the panel */
        #xterm-container {
            width: 100%;
            height: 100%;
            padding: 8px 4px 4px 8px;
        }
        #xterm-container .xterm { height: 100%; }
        #xterm-container .xterm-viewport { overflow-y: auto !important; }

        /* Stats pane (hidden by default) */
        .stats-pane {
            display: none;
            padding: 14px;
            overflow-y: auto;
            height: 100%;
            font-family: var(--mono);
            font-size: 13px;
        }
        .stats-pane.active { display: block; }
        #xterm-container.hidden { display: none; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .stat-card {
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 14px;
        }
        .stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 5px; }
        .stat-val { font-size: 20px; font-weight: 700; color: var(--text); }
        .stat-val.ok { color: var(--green); }
        .stat-val.err { color: var(--red); }
        .stat-val.warn { color: var(--yellow); }
        .stat-empty { color: var(--text-muted); font-size: 13px; }
        .stat-section-title { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin: 14px 0 8px; }

        /* ── Status Bar ── */
        .statusbar {
            background: var(--accent);
            height: 24px;
            padding: 0 14px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
            transition: background 0.3s;
        }
        .statusbar.success { background: #1a7f37; }
        .statusbar.error   { background: #b62324; }
        .statusbar.running { background: #7c4dff; }
        .statusbar.killed  { background: #6e340c; }

        .sb-item { font-size: 11px; color: rgba(255,255,255,0.9); display: flex; align-items: center; gap: 5px; }
        .sb-sep  { width: 1px; height: 12px; background: rgba(255,255,255,0.25); }
        .sb-spacer { flex: 1; }

        /* Responsive */
        @media (max-width: 700px) {
            .main { flex-direction: column; }
            .editor-panel { flex: 1; border-right: none; border-bottom: 1px solid var(--border); }
            .terminal-panel { flex: 1; }
            .logo span { display: none; }
        }
    </style>
</head>
<body>

<!-- Header -->
<header class="header">
    <div class="logo">
        <div class="logo-icon">⚡</div>
        <span>Piston IDE</span>
    </div>
    <div class="sep"></div>
    <div class="controls">
        <select id="lang-select"><option>Loading runtimes...</option></select>
        <span class="version-badge" id="version-badge">—</span>
        <div class="spacer"></div>
        <button class="kill-btn" id="kill-btn">
            <svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
            </svg>
            Stop
        </button>
        <button class="run-btn" id="run-btn">
            <svg class="run-icon" width="13" height="13" fill="currentColor" viewBox="0 0 24 24">
                <path d="M8 5v14l11-7z"/>
            </svg>
            <div class="spinner"></div>
            Run
        </button>
    </div>
</header>

<!-- Main Split -->
<div class="main">

    <!-- Editor Panel -->
    <div class="editor-panel">
        <div class="editor-titlebar">
            <div class="file-tab active">
                <div class="file-dot"></div>
                <span id="filename-label">main.py</span>
            </div>
        </div>
        <div id="editor"></div>
    </div>

    <!-- Terminal Panel -->
    <div class="terminal-panel">
        <div class="terminal-titlebar">
            <button class="term-tab active" id="tab-terminal-btn">Terminal</button>
            <button class="term-tab" id="tab-stats-btn">Stats</button>
            <div class="tab-spacer"></div>
            <button class="clear-btn" id="clear-btn" title="Clear terminal">Clear</button>
        </div>
        <div class="terminal-body">
            <div id="xterm-container"></div>
            <div class="stats-pane" id="stats-pane">
                <span class="stat-empty">Run code to see execution stats.</span>
            </div>
        </div>
    </div>

</div>

<!-- Status Bar -->
<div class="statusbar" id="statusbar">
    <span class="sb-item" id="sb-lang">⚡ Piston IDE</span>
    <span class="sb-sep"></span>
    <span class="sb-item" id="sb-msg">Ready — Ctrl+Enter to run</span>
    <span class="sb-spacer"></span>
    <span class="sb-item">Interactive Terminal</span>
</div>

<!-- xterm.js + Monaco — served from /vendor/ (baked into nginx image, air-gap safe) -->
<script src="/vendor/xterm.js"></script>
<script src="/vendor/xterm-addon-fit.js"></script>
<script src="/vendor/vs/loader.js"></script>

const DEFAULT_CODE = {

    'csharp.net': `using System;\n\nclass Program {\n    static void Main() {\n        Console.Write("Enter your name: ");\n        string name = Console.ReadLine();\n        Console.WriteLine($"Hello, {name}!");\n    }\n}`,

// ── State ──────────────────────────────────────────────────────────────────

let editor       = null;
let runtimes     = [];
let runtimesByLang = {};
let term         = null;
let fitAddon     = null;
let activeWs     = null;
let isRunning    = false;

// ── Terminal Init ──────────────────────────────────────────────────────────

function initTerminal() {
    term = new Terminal({
        theme: {
            background: '#0d1117',
            foreground: '#c9d1d9',
            cursor:     '#58a6ff',
            cursorAccent: '#0d1117',
            selection:  'rgba(88,166,255,0.3)',
            black:   '#484f58', red:     '#f85149',
            green:   '#3fb950', yellow:  '#d29922',
            blue:    '#58a6ff', magenta: '#bc8cff',
            cyan:    '#39c5cf', white:   '#c9d1d9',
            brightBlack:   '#6e7681', brightRed:     '#ff7b72',
            brightGreen:   '#56d364', brightYellow:  '#e3b341',
            brightBlue:    '#79c0ff', brightMagenta: '#d2a8ff',
            brightCyan:    '#56d4dd', brightWhite:   '#f0f6fc',
        },
        fontFamily: "'JetBrains Mono', 'Cascadia Code', 'Fira Code', 'Menlo', monospace",
        fontSize: 13,
        lineHeight: 1.5,
        cursorBlink: true,
        cursorStyle: 'bar',
        scrollback: 5000,
        disableStdin: false,
        allowProposedApi: true,
        convertEol: true,
    });

    fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('xterm-container'));
    fitAddon.fit();

    // Welcome message
    termWriteLn('\x1b[2m[Piston IDE — Interactive Terminal]\x1b[0m');
    termWriteLn('\x1b[2mPress \x1b[0m\x1b[1;32mCtrl+Enter\x1b[0m\x1b[2m or click Run to execute your code.\x1b[0m');
    termWriteLn('');

    // Resize observer
    const ro = new ResizeObserver(() => { try { fitAddon.fit(); } catch(_) {} });
    ro.observe(document.getElementById('xterm-container'));

    // Input handler — line-buffered for interactive stdin
    let lineBuffer = '';
    term.onData(data => {
        if (!isRunning || !activeWs || activeWs.readyState !== WebSocket.OPEN) return;

        if (data === '\r' || data === '\n') {
            term.write('\r\n');
            activeWs.send(JSON.stringify({ type: 'data', stream: 'stdin', data: lineBuffer + '\n' }));
            lineBuffer = '';
        } else if (data === '\u007f' || data === '\u0008') {
            // Backspace
            if (lineBuffer.length > 0) {
                lineBuffer = lineBuffer.slice(0, -1);
                term.write('\b \b');
            }
        } else if (data === '\u0003') {
            // Ctrl+C → SIGINT
            term.write('^C\r\n');
            if (activeWs && activeWs.readyState === WebSocket.OPEN) {
                try { activeWs.send(JSON.stringify({ type: 'signal', signal: 'SIGINT' })); } catch(_) {}
            }
            lineBuffer = '';
        } else if (data >= ' ' || data === '\t') {
            lineBuffer += data;
            term.write(data);
        }
    });
}

function termWriteLn(text) { term.write(text + '\r\n'); }
function termClear() { term.write('\x1b[2J\x1b[H'); }

// ── Monaco Init ────────────────────────────────────────────────────────────

require.config({ paths: { vs: '/vendor/vs' } });

        value: DEFAULT_CODE.python,
        language: 'python',
        theme: 'vs-dark',
        fontSize: 14,
        fontFamily: "'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace",
        fontLigatures: true,
        minimap: { enabled: false },
        automaticLayout: true,
        lineNumbers: 'on',
        scrollBeyondLastLine: false,
        renderLineHighlight: 'line',
        tabSize: 4,
        insertSpaces: true,
        wordWrap: 'on',
        padding: { top: 12, bottom: 12 },
        smoothScrolling: true,
        cursorBlinking: 'smooth',
        cursorSmoothCaretAnimation: 'on',
    });

    editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, runCode);

    initTerminal();
    loadRuntimes();
});

// ── Runtimes ───────────────────────────────────────────────────────────────

async function loadRuntimes() {
    try {
        const res = await fetch('/api/v2/runtimes');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        runtimes = await res.json();

        // Filter out .net runtimes (dotnet 5.x incompatible with OpenSSL 3 on this server)
        const BLOCKED = new Set(['csharp.net', 'fsharp.net', 'basic.net', 'fsi']);
        runtimesByLang = {};
        runtimes.forEach(rt => {
            if (BLOCKED.has(rt.language)) return;
            const existing = runtimesByLang[rt.language];
            if (!existing || semverGt(rt.version, existing.version)) {
                runtimesByLang[rt.language] = rt;
            }
        });

        populateSelect();
    } catch (e) {
        termWriteLn('\x1b[31mCould not reach Piston API: ' + e.message + '\x1b[0m');
        termWriteLn('\x1b[33mMake sure the stack is running: ./deploy.sh start\x1b[0m');
        setStatus('Error', 'API unavailable', 'error');
    }
}

function semverGt(a, b) {
    const pa = String(a).split('.').map(n => parseInt(n) || 0);
    const pb = String(b).split('.').map(n => parseInt(n) || 0);
    for (let i = 0; i < 3; i++) {
        if ((pa[i]||0) > (pb[i]||0)) return true;
        if ((pa[i]||0) < (pb[i]||0)) return false;
    }
    return false;
}

function populateSelect() {
    const sel = document.getElementById('lang-select');
    sel.innerHTML = '';
    const langs = Object.keys(runtimesByLang).sort();

    if (langs.length === 0) {
        const opt = document.createElement('option');
        opt.textContent = 'No runtimes installed';
        opt.disabled = true;
        sel.appendChild(opt);
        setStatus('Piston IDE', 'No runtimes — run: ./deploy.sh install python', 'error');
        return;
    }

    langs.forEach(lang => {
        const opt = document.createElement('option');
        opt.value = lang;
        opt.textContent = lang;
        sel.appendChild(opt);
    });

    if (runtimesByLang.python) sel.value = 'python';
    onLangChange();
}

function onLangChange() {
    const sel = document.getElementById('lang-select');
    const lang = sel.value;
    const rt = runtimesByLang[lang];
    if (!rt || !editor) return;

    document.getElementById('version-badge').textContent = `v${rt.version}`;
    monaco.editor.setModelLanguage(editor.getModel(), MONACO_LANG[lang] || 'plaintext');
    editor.setValue(DEFAULT_CODE[lang] || `// ${lang}\n`);
    editor.setPosition({ lineNumber: 1, column: 1 });
    const stem = FILE_STEM[lang] || 'main';
    const ext  = FILE_EXT[lang] || 'txt';
    document.getElementById('filename-label').textContent = `${stem}.${ext}`;
    setStatus(`${lang} ${rt.version}`, 'Ready — Ctrl+Enter to run', 'default');

}

// ── Run via WebSocket ──────────────────────────────────────────────────────

async function runCode() {
    if (isRunning) return;

    const sel  = document.getElementById('lang-select');
    const lang = sel.value;
    const rt   = runtimesByLang[lang];
    if (!rt || !editor) return;

    const code = editor.getValue();
    const stem = FILE_STEM[lang] || 'main';
    const ext  = FILE_EXT[lang] || 'txt';
    const fileName = `${stem}.${ext}`;

    setRunning(true);
    termClear();
    showTab('terminal');
    term.focus();

    const wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl   = `${wsProto}//${location.host}/api/v2/connect`;

    let compileStats = null;
    let runStats     = null;
    let currentStage = null;

    try {
        const ws = new WebSocket(wsUrl);
        activeWs = ws;

        ws.onopen = () => {
            setStatus(`${lang} ${rt.version}`, 'Running...', 'running');
            ws.send(JSON.stringify({
                type: 'init',
                language: lang,
                version: rt.version,
                files: [{ name: fileName, content: code }],
                args: [],
                stdin: '',
            }));
        };

        ws.onmessage = (event) => {
            let msg;
            try { msg = JSON.parse(event.data); } catch (_) { return; }

            switch (msg.type) {
                case 'runtime':
                    termWriteLn(`\x1b[2m[${msg.language} ${msg.version}]\x1b[0m`);
                    break;

                case 'stage':
                    currentStage = msg.stage;
                    if (msg.stage === 'compile') {
                        termWriteLn('\x1b[33m[compiling...]\x1b[0m');
                    } else if (msg.stage === 'run') {
                        termWriteLn('\x1b[32m[running — type below to send input]\x1b[0m');
                        term.focus();
                    }
                    break;

                case 'data':
                    if (msg.stream === 'stderr') {
                        term.write('\x1b[31m' + msg.data + '\x1b[0m');
                    } else {
                        term.write(msg.data);
                    }
                    break;

                case 'exit':
                    if (msg.stage === 'compile') compileStats = msg;
                    if (msg.stage === 'run')     runStats     = msg;
                    break;
            }
        };

        ws.onclose = (event) => {
            activeWs = null;
            setRunning(false);

            if (event.code === 4999) {
                // Normal job completion
                const exitCode = runStats?.code ?? compileStats?.code;
                const ok = exitCode === 0 && !runStats?.signal;
                const msg = exitCode != null
                    ? `Exited ${exitCode}${runStats?.signal ? ' · ' + runStats.signal : ''}`
                    : 'Finished';
                termWriteLn('');
                termWriteLn(`\x1b[2m[${ok ? '✓' : '✗'} ${msg}]\x1b[0m`);
                setStatus(`${lang} ${rt.version}`, msg, ok ? 'success' : 'error');
                updateStats(lang, rt.version, compileStats, runStats);
            } else if (event.code === 4001) {
                termWriteLn('\x1b[31m[Timed out waiting for init]\x1b[0m');
                setStatus(lang, 'Init timeout', 'error');
            } else if (isKilled) {
                termWriteLn('\x1b[33m[Stopped by user]\x1b[0m');
                setStatus(`${lang} ${rt.version}`, 'Stopped', 'killed');
            } else {
                termWriteLn(`\x1b[31m[Connection closed: ${event.code}]\x1b[0m`);
                setStatus(lang, 'Disconnected', 'error');
            }
            isKilled = false;
        };

        ws.onerror = () => {
            termWriteLn('\x1b[31m[WebSocket error — is the API running?]\x1b[0m');
            setStatus(lang, 'Connection error', 'error');
            setRunning(false);
            activeWs = null;
        };

    } catch (e) {
        termWriteLn(`\x1b[31m[Error: ${e.message}]\x1b[0m`);
        setRunning(false);
    }
}

let isKilled = false;

function killJob() {
    if (!activeWs) return;
    isKilled = true;
    try { activeWs.close(); } catch(_) {}
    activeWs = null;
}

// ── Stats ──────────────────────────────────────────────────────────────────

function updateStats(lang, ver, compile, run) {
    const pane = document.getElementById('stats-pane');
    if (!run && !compile) { return; }

    const r = run || {};
    const c = compile;
    const ok = r.code === 0 && !r.signal;

    let html = `<div class="stats-grid">
        <div class="stat-card"><div class="stat-label">Exit Code</div><div class="stat-val ${ok ? 'ok' : 'err'}">${r.code ?? '—'}</div></div>
        <div class="stat-card"><div class="stat-label">Signal</div><div class="stat-val ${r.signal ? 'err' : ''}">${r.signal || 'none'}</div></div>
        <div class="stat-card"><div class="stat-label">Language</div><div class="stat-val" style="font-size:14px">${lang}</div></div>
        <div class="stat-card"><div class="stat-label">Version</div><div class="stat-val" style="font-size:14px">${ver}</div></div>
    </div>`;

    if (c) {
        const cc = c.code === 0 ? 'ok' : 'err';
        html += `<div class="stat-section-title">Compile Stage</div>
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-label">Exit Code</div><div class="stat-val ${cc}">${c.code ?? '—'}</div></div>
            <div class="stat-card"><div class="stat-label">Signal</div><div class="stat-val ${c.signal ? 'err' : ''}">${c.signal || 'none'}</div></div>
        </div>`;
    }

    pane.innerHTML = html;
}

// ── UI Helpers ─────────────────────────────────────────────────────────────

function setRunning(running) {
    isRunning = running;
    const runBtn  = document.getElementById('run-btn');
    const killBtn = document.getElementById('kill-btn');
    runBtn.disabled = running;
    runBtn.classList.toggle('loading', running);
    killBtn.classList.toggle('visible', running);
}

function showTab(tab) {
    const termContainer = document.getElementById('xterm-container');
    const statsPane     = document.getElementById('stats-pane');
    const termBtn       = document.getElementById('tab-terminal-btn');
    const statsBtn      = document.getElementById('tab-stats-btn');

    if (tab === 'terminal') {
        termContainer.classList.remove('hidden');
        statsPane.classList.remove('active');
        termBtn.classList.add('active');
        statsBtn.classList.remove('active');
        try { fitAddon.fit(); } catch(_) {}
    } else {
        termContainer.classList.add('hidden');
        statsPane.classList.add('active');
        termBtn.classList.remove('active');
        statsBtn.classList.add('active');
    }
}

function setStatus(lang, msg, state = 'default') {
    const bar = document.getElementById('statusbar');
    bar.className = 'statusbar' + (state !== 'default' ? ` ${state}` : '');
    document.getElementById('sb-lang').textContent = `⚡ ${lang}`;
    document.getElementById('sb-msg').textContent  = msg;
}

// ── Event Listeners ────────────────────────────────────────────────────────

document.getElementById('lang-select').addEventListener('change', onLangChange);
document.getElementById('run-btn').addEventListener('click', runCode);
document.getElementById('kill-btn').addEventListener('click', killJob);
document.getElementById('clear-btn').addEventListener('click', () => { termClear(); });

document.getElementById('tab-terminal-btn').addEventListener('click', () => showTab('terminal'));
document.getElementById('tab-stats-btn').addEventListener('click', () => showTab('stats'));
</script>
</body>
</html>
