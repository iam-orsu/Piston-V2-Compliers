<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piston IDE</title>
    <style>
        :root {
            --bg-0: #0d1117;
            --bg-1: #161b22;
            --bg-2: #21262d;
            --border: #30363d;
            --text: #c9d1d9;
            --text-dim: #8b949e;
            --text-muted: #484f58;
            --accent: #58a6ff;
            --green: #3fb950;
            --green-dark: #238636;
            --red: #f85149;
            --yellow: #d29922;
            --purple: #bc8cff;
            --radius: 6px;
            --mono: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-0);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ── Header ── */
        .header {
            background: var(--bg-1);
            border-bottom: 1px solid var(--border);
            height: 52px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            z-index: 10;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 15px;
            white-space: nowrap;
            color: var(--text);
        }

        .logo-icon {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #58a6ff, #bc8cff);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .sep { width: 1px; height: 24px; background: var(--border); flex-shrink: 0; }

        .controls { display: flex; align-items: center; gap: 8px; flex: 1; }

        select, .pill-input {
            background: var(--bg-2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 10px;
            border-radius: var(--radius);
            font-size: 13px;
            outline: none;
            transition: border-color 0.15s;
            cursor: pointer;
        }
        select:hover, .pill-input:hover { border-color: var(--accent); }
        select:focus, .pill-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(88,166,255,0.15); }

        #lang-select { min-width: 140px; }

        .version-badge {
            background: var(--bg-2);
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-family: var(--mono);
            white-space: nowrap;
        }

        .spacer { flex: 1; }

        .icon-btn {
            background: var(--bg-2);
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 6px 12px;
            border-radius: var(--radius);
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .icon-btn:hover { border-color: var(--accent); color: var(--text); }
        .icon-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(88,166,255,0.08); }

        .run-btn {
            background: var(--green-dark);
            border: 1px solid rgba(63,185,80,0.4);
            color: #fff;
            padding: 7px 20px;
            border-radius: var(--radius);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 7px;
            transition: background 0.15s;
            white-space: nowrap;
        }
        .run-btn:hover { background: #2ea043; }
        .run-btn:disabled { background: var(--bg-2); border-color: var(--border); color: var(--text-muted); cursor: not-allowed; }
        .run-btn .spinner { display: none; }
        .run-btn.loading .run-icon { display: none; }
        .run-btn.loading .spinner { display: block; }

        .spinner {
            width: 14px; height: 14px;
            border: 2px solid rgba(255,255,255,0.25);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Stdin/Args Panel ── */
        .input-panel {
            background: var(--bg-1);
            border-bottom: 1px solid var(--border);
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.25s ease, padding 0.25s ease;
            flex-shrink: 0;
        }
        .input-panel.open { max-height: 130px; padding: 10px 16px; }

        .input-panel-inner { display: flex; gap: 10px; align-items: flex-start; }

        .input-group { display: flex; flex-direction: column; gap: 4px; flex: 1; }
        .input-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; }

        .input-panel textarea, .input-panel input {
            background: var(--bg-2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 7px 10px;
            border-radius: var(--radius);
            font-family: var(--mono);
            font-size: 12px;
            resize: none;
            outline: none;
            transition: border-color 0.15s;
            width: 100%;
        }
        .input-panel textarea:focus, .input-panel input:focus { border-color: var(--accent); }
        .input-panel textarea { height: 70px; }

        /* ── Main Layout ── */
        .main {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        /* ── Editor ── */
        .editor-panel {
            flex: 6;
            min-width: 0;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
        }

        .editor-titlebar {
            background: var(--bg-1);
            border-bottom: 1px solid var(--border);
            height: 36px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .file-tab {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 14px;
            height: 100%;
            font-size: 12px;
            color: var(--text-dim);
            border-bottom: 2px solid transparent;
        }
        .file-tab.active { color: var(--text); border-bottom-color: var(--accent); }

        .file-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

        #editor { flex: 1; min-height: 0; }

        /* ── Output Panel ── */
        .output-panel {
            flex: 4;
            min-width: 0;
            display: flex;
            flex-direction: column;
            background: var(--bg-0);
        }

        .output-titlebar {
            background: var(--bg-1);
            border-bottom: 1px solid var(--border);
            height: 36px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .out-tab {
            background: none;
            border: none;
            color: var(--text-dim);
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .out-tab:hover { background: var(--bg-2); color: var(--text); }
        .out-tab.active { background: var(--bg-2); color: var(--text); }

        .out-tab .badge {
            display: inline-block;
            background: var(--red);
            color: #fff;
            font-size: 10px;
            padding: 1px 5px;
            border-radius: 8px;
            margin-left: 4px;
            display: none;
        }
        .out-tab .badge.show { display: inline-block; }

        .output-body {
            flex: 1;
            overflow-y: auto;
            padding: 14px;
            font-family: var(--mono);
            font-size: 13px;
            line-height: 1.65;
        }
        .output-body::-webkit-scrollbar { width: 6px; }
        .output-body::-webkit-scrollbar-track { background: transparent; }
        .output-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        /* Placeholder */
        .placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
            gap: 12px;
            min-height: 200px;
        }
        .placeholder svg { opacity: 0.2; }
        .placeholder p { font-size: 13px; font-family: var(--mono); }
        .placeholder kbd {
            background: var(--bg-2);
            border: 1px solid var(--border);
            border-radius: 3px;
            padding: 1px 6px;
            font-size: 11px;
        }

        /* Output text styles */
        .out-stdout { color: var(--text); white-space: pre-wrap; word-break: break-all; }
        .out-stderr { color: var(--red); white-space: pre-wrap; word-break: break-all; }
        .out-compile-label { color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; margin-top: 12px; }
        .out-compile-label:first-child { margin-top: 0; }
        .out-empty { color: var(--text-muted); font-style: italic; }

        /* Error block */
        .err-block {
            background: rgba(248,81,73,0.08);
            border: 1px solid rgba(248,81,73,0.25);
            border-radius: var(--radius);
            padding: 12px;
            color: var(--red);
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* Stats */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .stat-card {
            background: var(--bg-1);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 14px;
        }
        .stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 5px; }
        .stat-val { font-size: 20px; font-weight: 700; color: var(--text); }
        .stat-val.ok { color: var(--green); }
        .stat-val.err { color: var(--red); }
        .stat-val.warn { color: var(--yellow); }
        .stat-section-title { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin: 14px 0 8px; }

        /* ── Status Bar ── */
        .statusbar {
            background: var(--accent);
            height: 24px;
            padding: 0 14px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
            transition: background 0.3s;
        }
        .statusbar.success { background: #1a7f37; }
        .statusbar.error { background: #b62324; }
        .statusbar.running { background: #7c4dff; }

        .sb-item { font-size: 11px; color: rgba(255,255,255,0.9); display: flex; align-items: center; gap: 5px; }
        .sb-sep { width: 1px; height: 12px; background: rgba(255,255,255,0.25); }
        .sb-spacer { flex: 1; }

        /* Responsive */
        @media (max-width: 700px) {
            .main { flex-direction: column; }
            .editor-panel { flex: 1; border-right: none; border-bottom: 1px solid var(--border); }
            .output-panel { flex: 1; }
            .logo span { display: none; }
        }
    </style>
</head>
<body>

<!-- Header -->
<header class="header">
    <div class="logo">
        <div class="logo-icon">⚡</div>
        <span>Piston IDE</span>
    </div>
    <div class="sep"></div>
    <div class="controls">
        <select id="lang-select">
            <option>Loading runtimes...</option>
        </select>
        <span class="version-badge" id="version-badge">—</span>
        <div class="spacer"></div>
        <button class="icon-btn" id="stdin-toggle">
            <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h8m-8 6h16"/>
            </svg>
            stdin / args
        </button>
        <button class="run-btn" id="run-btn">
            <svg class="run-icon" width="13" height="13" fill="currentColor" viewBox="0 0 24 24">
                <path d="M8 5v14l11-7z"/>
            </svg>
            <div class="spinner"></div>
            Run
        </button>
    </div>
</header>

<!-- Stdin / Args Panel -->
<div class="input-panel" id="input-panel">
    <div class="input-panel-inner">
        <div class="input-group" style="flex:3">
            <span class="input-label">stdin</span>
            <textarea id="stdin-input" placeholder="Standard input passed to your program..."></textarea>
        </div>
        <div class="input-group" style="flex:1">
            <span class="input-label">args (space-separated)</span>
            <input type="text" id="args-input" placeholder="arg1 arg2 arg3">
        </div>
    </div>
</div>

<!-- Main Split -->
<div class="main">

    <!-- Editor Panel -->
    <div class="editor-panel">
        <div class="editor-titlebar">
            <div class="file-tab active">
                <div class="file-dot"></div>
                <span id="filename-label">main.py</span>
            </div>
        </div>
        <div id="editor"></div>
    </div>

    <!-- Output Panel -->
    <div class="output-panel">
        <div class="output-titlebar">
            <button class="out-tab active" data-tab="output">Output</button>
            <button class="out-tab" data-tab="stdout">
                Stdout <span class="badge" id="badge-stdout"></span>
            </button>
            <button class="out-tab" data-tab="stderr">
                Stderr <span class="badge" id="badge-stderr"></span>
            </button>
            <button class="out-tab" data-tab="stats">Stats</button>
        </div>
        <div class="output-body">
            <div class="tab-pane active" id="tab-output">
                <div class="placeholder" id="placeholder">
                    <svg width="44" height="44" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                    </svg>
                    <p>Press <kbd>▶ Run</kbd> or <kbd>Ctrl+Enter</kbd> to execute your code</p>
                </div>
                <div id="output-content"></div>
            </div>
            <div class="tab-pane" id="tab-stdout">
                <div id="stdout-content" class="out-empty">No output yet.</div>
            </div>
            <div class="tab-pane" id="tab-stderr">
                <div id="stderr-content" class="out-empty">No stderr yet.</div>
            </div>
            <div class="tab-pane" id="tab-stats">
                <div id="stats-content" class="out-empty">Run code to see execution stats.</div>
            </div>
        </div>
    </div>

</div>

<!-- Status Bar -->
<div class="statusbar" id="statusbar">
    <span class="sb-item" id="sb-lang">⚡ Piston IDE</span>
    <span class="sb-sep"></span>
    <span class="sb-item" id="sb-msg">Ready — Ctrl+Enter to run</span>
    <span class="sb-spacer"></span>
    <span class="sb-item">v2 API</span>
</div>

<!-- Monaco Loader -->
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/loader.js"></script>
<script>
'use strict';

// ── Language maps ──────────────────────────────────────────────────────────

const MONACO_LANG = {
    python: 'python', python2: 'python',
    javascript: 'javascript', typescript: 'typescript',
    java: 'java',
    c: 'c', 'c++': 'cpp', cpp: 'cpp',
    csharp: 'csharp', 'csharp.net': 'csharp',
    'fsharp.net': 'fsharp', fsi: 'fsharp',
    go: 'go',
    rust: 'rust',
    ruby: 'ruby',
    php: 'php',
    kotlin: 'kotlin',
    swift: 'swift',
    scala: 'scala',
    haskell: 'haskell',
    lua: 'lua',
    perl: 'perl',
    r: 'r', rscript: 'r',
    bash: 'shell', sh: 'shell', dash: 'shell',
    powershell: 'powershell',
    dart: 'dart',
    julia: 'julia',
    groovy: 'java',
    clojure: 'clojure',
    elixir: 'elixir',
    erlang: 'plaintext',
    ocaml: 'plaintext',
    pascal: 'pascal',
    cobol: 'plaintext',
    fortran: 'plaintext',
    nim: 'plaintext',
    sqlite3: 'sql',
    brainfuck: 'plaintext',
    nasm: 'plaintext', nasm64: 'plaintext',
    zig: 'plaintext',
    vlang: 'plaintext',
    coffeescript: 'coffee',
    crystal: 'ruby',
    lisp: 'plaintext',
    prolog: 'plaintext',
};

const FILE_EXT = {
    python: 'py', python2: 'py',
    javascript: 'js', typescript: 'ts',
    java: 'java',
    c: 'c', 'c++': 'cpp', cpp: 'cpp',
    csharp: 'cs', 'csharp.net': 'cs',
    'fsharp.net': 'fs', fsi: 'fsx',
    go: 'go',
    rust: 'rs',
    ruby: 'rb',
    php: 'php',
    kotlin: 'kt',
    swift: 'swift',
    scala: 'scala',
    haskell: 'hs',
    lua: 'lua',
    perl: 'pl',
    r: 'r', rscript: 'r',
    bash: 'sh', sh: 'sh', dash: 'sh',
    powershell: 'ps1',
    dart: 'dart',
    julia: 'jl',
    groovy: 'groovy',
    clojure: 'clj',
    elixir: 'ex',
    erlang: 'erl',
    ocaml: 'ml',
    pascal: 'pas',
    nim: 'nim',
    sqlite3: 'sql',
    brainfuck: 'bf',
    nasm: 'asm', nasm64: 'asm',
    zig: 'zig',
    vlang: 'v',
    coffeescript: 'coffee',
    crystal: 'cr',
    lisp: 'lisp',
    prolog: 'pl',
    cobol: 'cob',
    fortran: 'f90',
};

const DEFAULT_CODE = {
    python: `# Python\nprint("Hello, World!")`,
    python2: `# Python 2\nprint "Hello, World!"`,
    javascript: `// JavaScript\nconsole.log("Hello, World!");`,
    typescript: `// TypeScript\nconst message: string = "Hello, World!";\nconsole.log(message);`,
    java: `public class Main {\n    public static void main(String[] args) {\n        System.out.println("Hello, World!");\n    }\n}`,
    'c++': `#include <iostream>\n\nint main() {\n    std::cout << "Hello, World!" << std::endl;\n    return 0;\n}`,
    c: `#include <stdio.h>\n\nint main() {\n    printf("Hello, World!\\n");\n    return 0;\n}`,
    csharp: `using System;\n\nclass Program {\n    static void Main() {\n        Console.WriteLine("Hello, World!");\n    }\n}`,
    'csharp.net': `using System;\n\nclass Program {\n    static void Main() {\n        Console.WriteLine("Hello, World!");\n    }\n}`,
    go: `package main\n\nimport "fmt"\n\nfunc main() {\n    fmt.Println("Hello, World!")\n}`,
    rust: `fn main() {\n    println!("Hello, World!");\n}`,
    ruby: `puts "Hello, World!"`,
    php: `<?php\necho "Hello, World!\\n";`,
    kotlin: `fun main() {\n    println("Hello, World!")\n}`,
    swift: `print("Hello, World!")`,
    scala: `object Main extends App {\n  println("Hello, World!")\n}`,
    haskell: `main :: IO ()\nmain = putStrLn "Hello, World!"`,
    lua: `print("Hello, World!")`,
    perl: `print "Hello, World!\\n";`,
    r: `cat("Hello, World!\\n")`,
    rscript: `cat("Hello, World!\\n")`,
    bash: `#!/bin/bash\necho "Hello, World!"`,
    sh: `#!/bin/sh\necho "Hello, World!"`,
    dash: `#!/bin/dash\necho "Hello, World!"`,
    powershell: `Write-Output "Hello, World!"`,
    dart: `void main() {\n  print('Hello, World!');\n}`,
    julia: `println("Hello, World!")`,
    elixir: `IO.puts "Hello, World!"`,
    erlang: `-module(main).\n-export([main/0]).\n\nmain() ->\n    io:fwrite("Hello, World!~n").`,
    ocaml: `let () = print_endline "Hello, World!"`,
    pascal: `program Hello;\nbegin\n  writeln('Hello, World!');\nend.`,
    nim: `echo "Hello, World!"`,
    zig: `const std = @import("std");\n\npub fn main() !void {\n    const stdout = std.io.getStdOut().writer();\n    try stdout.print("Hello, World!\\n", .{});\n}`,
    sqlite3: `SELECT 'Hello, World!';`,
    brainfuck: `++++++++[>++++[>++>+++>+++>+<<<<-]>+>+>->>+[<]<-]>>.>---.+++++++..+++.>>.<-.<.+++.------.--------.>>+.>++.`,
    groovy: `println "Hello, World!"`,
    clojure: `(println "Hello, World!")`,
    coffeescript: `console.log "Hello, World!"`,
    crystal: `puts "Hello, World!"`,
    cobol: `       IDENTIFICATION DIVISION.\n       PROGRAM-ID. Hello.\n       PROCEDURE DIVISION.\n           DISPLAY "Hello, World!".\n           STOP RUN.`,
    lisp: `(print "Hello, World!")`,
    prolog: `:- initialization(main, main).\nmain :- write('Hello, World!'), nl.`,
};

// ── State ──────────────────────────────────────────────────────────────────

let editor = null;
let runtimes = [];
let runtimesByLang = {};

// ── Monaco Init ────────────────────────────────────────────────────────────

require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs' } });

require(['vs/editor/editor.main'], () => {
    editor = monaco.editor.create(document.getElementById('editor'), {
        value: DEFAULT_CODE.python,
        language: 'python',
        theme: 'vs-dark',
        fontSize: 14,
        fontFamily: "'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace",
        fontLigatures: true,
        minimap: { enabled: false },
        automaticLayout: true,
        lineNumbers: 'on',
        scrollBeyondLastLine: false,
        renderLineHighlight: 'line',
        tabSize: 4,
        insertSpaces: true,
        wordWrap: 'on',
        padding: { top: 12, bottom: 12 },
        smoothScrolling: true,
        cursorBlinking: 'smooth',
        cursorSmoothCaretAnimation: 'on',
    });

    editor.addCommand(
        monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter,
        runCode
    );

    loadRuntimes();
});

// ── Runtimes ───────────────────────────────────────────────────────────────

async function loadRuntimes() {
    try {
        const res = await fetch('/api/v2/runtimes');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        runtimes = await res.json();

        // Group by language, pick latest version
        runtimesByLang = {};
        runtimes.forEach(rt => {
            const existing = runtimesByLang[rt.language];
            if (!existing || semverGt(rt.version, existing.version)) {
                runtimesByLang[rt.language] = rt;
            }
        });

        populateSelect();
    } catch (e) {
        showApiError(`Could not reach Piston API: ${e.message}\n\nMake sure the container is running:\n  ./deploy.sh start`);
        setStatus('Error', 'API unavailable', 'error');
    }
}

function semverGt(a, b) {
    const pa = String(a).split('.').map(n => parseInt(n) || 0);
    const pb = String(b).split('.').map(n => parseInt(n) || 0);
    for (let i = 0; i < 3; i++) {
        if ((pa[i] || 0) > (pb[i] || 0)) return true;
        if ((pa[i] || 0) < (pb[i] || 0)) return false;
    }
    return false;
}

function populateSelect() {
    const sel = document.getElementById('lang-select');
    sel.innerHTML = '';

    const langs = Object.keys(runtimesByLang).sort();
    langs.forEach(lang => {
        const opt = document.createElement('option');
        opt.value = lang;
        opt.textContent = lang;
        opt.dataset.version = runtimesByLang[lang].version;
        sel.appendChild(opt);
    });

    if (langs.length === 0) {
        const opt = document.createElement('option');
        opt.textContent = 'No runtimes installed';
        opt.disabled = true;
        sel.appendChild(opt);
        setStatus('Piston IDE', 'No runtimes — install with: ./deploy.sh install python', 'error');
        return;
    }

    // Prefer python, else first
    if (runtimesByLang.python) sel.value = 'python';
    onLangChange();
}

function onLangChange() {
    const sel = document.getElementById('lang-select');
    const lang = sel.value;
    const rt = runtimesByLang[lang];
    if (!rt || !editor) return;

    document.getElementById('version-badge').textContent = `v${rt.version}`;

    const monacoLang = MONACO_LANG[lang] || 'plaintext';
    monaco.editor.setModelLanguage(editor.getModel(), monacoLang);

    const code = DEFAULT_CODE[lang] || `// ${lang}\n`;
    editor.setValue(code);
    editor.setPosition({ lineNumber: 1, column: 1 });

    const ext = FILE_EXT[lang] || 'txt';
    document.getElementById('filename-label').textContent = `main.${ext}`;

    setStatus(`${lang} ${rt.version}`, 'Ready — Ctrl+Enter to run', 'default');
}

// ── Run ────────────────────────────────────────────────────────────────────

async function runCode() {
    const sel = document.getElementById('lang-select');
    const lang = sel.value;
    const rt = runtimesByLang[lang];
    if (!rt || !editor) return;

    const btn = document.getElementById('run-btn');
    btn.disabled = true;
    btn.classList.add('loading');

    const code = editor.getValue();
    const stdin = document.getElementById('stdin-input').value;
    const argsRaw = document.getElementById('args-input').value.trim();
    const args = argsRaw ? argsRaw.split(/\s+/) : [];
    const ext = FILE_EXT[lang] || 'txt';

    clearOutput();
    setStatus(`${lang} ${rt.version}`, 'Running...', 'running');

    try {
        const res = await fetch('/api/v2/execute', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                language: lang,
                version: rt.version,
                files: [{ name: `main.${ext}`, content: code }],
                stdin,
                args,
            }),
        });

        const data = await res.json();

        if (!res.ok) {
            showApiError(data.message || `API error ${res.status}`);
            setStatus(`${lang} ${rt.version}`, 'Error', 'error');
            return;
        }

        displayResult(data);
    } catch (e) {
        showApiError(`Network error: ${e.message}`);
        setStatus(`${lang} ${rt.version}`, 'Network error', 'error');
    } finally {
        btn.disabled = false;
        btn.classList.remove('loading');
    }
}

// ── Display Result ─────────────────────────────────────────────────────────

function displayResult(result) {
    const run = result.run || {};
    const compile = result.compile;
    const lang = result.language;
    const ver = result.version;

    // ── Output tab ──
    const outDiv = document.getElementById('output-content');
    document.getElementById('placeholder').style.display = 'none';
    let outHtml = '';

    if (compile) {
        if (compile.stdout) {
            outHtml += `<div class="out-compile-label">compile stdout</div><div class="out-stdout">${esc(compile.stdout)}</div>`;
        }
        if (compile.stderr) {
            outHtml += `<div class="out-compile-label">compile stderr</div><div class="out-stderr">${esc(compile.stderr)}</div>`;
        }
        if (compile.code !== 0) {
            setStatus(`${lang} ${ver}`, `Compile failed (exit ${compile.code})`, 'error');
            outDiv.innerHTML = outHtml || `<div class="err-block">Compilation failed with exit code ${compile.code}</div>`;
            updateSeparatePanes(run, compile);
            renderStats(result);
            return;
        }
    }

    if (run.stdout) outHtml += `<div class="out-stdout">${esc(run.stdout)}</div>`;
    if (run.stderr) outHtml += `<div class="out-stderr">${esc(run.stderr)}</div>`;
    if (!run.stdout && !run.stderr) outHtml += `<span class="out-empty">Program produced no output.</span>`;

    outDiv.innerHTML = outHtml;

    updateSeparatePanes(run, compile);
    renderStats(result);

    // Status bar
    const ok = run.code === 0 && !run.status;
    const statusMsg = ok
        ? `Exited 0 · ${run.wall_time ?? '?'}ms wall · ${fmt_mem(run.memory)}`
        : `Exit ${run.code ?? '?'}${run.signal ? ` · ${run.signal}` : ''}${run.status ? ` · ${run.status}` : ''}`;
    setStatus(`${lang} ${ver}`, statusMsg, ok ? 'success' : 'error');

    // Update stderr badge
    const stderrBadge = document.getElementById('badge-stderr');
    if (run.stderr) {
        stderrBadge.textContent = '!';
        stderrBadge.classList.add('show');
    }
    const stdoutBadge = document.getElementById('badge-stdout');
    if (run.stdout) {
        stdoutBadge.classList.remove('show');
    }
}

function updateSeparatePanes(run, compile) {
    const stdoutDiv = document.getElementById('stdout-content');
    const stderrDiv = document.getElementById('stderr-content');

    stdoutDiv.innerHTML = run.stdout
        ? `<div class="out-stdout">${esc(run.stdout)}</div>`
        : `<span class="out-empty">No stdout output.</span>`;

    let stderrHtml = '';
    if (compile && compile.stderr) {
        stderrHtml += `<div class="out-compile-label">compile</div><div class="out-stderr">${esc(compile.stderr)}</div>`;
    }
    if (run.stderr) stderrHtml += `<div class="out-stderr">${esc(run.stderr)}</div>`;
    stderrDiv.innerHTML = stderrHtml || `<span class="out-empty">No stderr output.</span>`;
}

function renderStats(result) {
    const run = result.run || {};
    const compile = result.compile;
    const codeClass = run.code === 0 ? 'ok' : 'err';
    const statusClass = !run.status ? 'ok' : 'warn';

    let html = `<div class="stats-grid">
        <div class="stat-card"><div class="stat-label">Exit Code</div><div class="stat-val ${codeClass}">${run.code ?? '—'}</div></div>
        <div class="stat-card"><div class="stat-label">Status</div><div class="stat-val ${statusClass}">${run.status || 'OK'}</div></div>
        <div class="stat-card"><div class="stat-label">Wall Time</div><div class="stat-val">${run.wall_time != null ? run.wall_time + ' ms' : '—'}</div></div>
        <div class="stat-card"><div class="stat-label">CPU Time</div><div class="stat-val">${run.cpu_time != null ? run.cpu_time + ' ms' : '—'}</div></div>
        <div class="stat-card"><div class="stat-label">Memory</div><div class="stat-val">${fmt_mem(run.memory)}</div></div>
        <div class="stat-card"><div class="stat-label">Signal</div><div class="stat-val ${run.signal ? 'err' : ''}">${run.signal || 'none'}</div></div>
    </div>`;

    if (compile) {
        const cc = compile.code === 0 ? 'ok' : 'err';
        html += `<div class="stat-section-title">Compile Stage</div>
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-label">Exit Code</div><div class="stat-val ${cc}">${compile.code ?? '—'}</div></div>
            <div class="stat-card"><div class="stat-label">Wall Time</div><div class="stat-val">${compile.wall_time != null ? compile.wall_time + ' ms' : '—'}</div></div>
            <div class="stat-card"><div class="stat-label">CPU Time</div><div class="stat-val">${compile.cpu_time != null ? compile.cpu_time + ' ms' : '—'}</div></div>
            <div class="stat-card"><div class="stat-label">Status</div><div class="stat-val ${compile.status ? 'warn' : 'ok'}">${compile.status || 'OK'}</div></div>
        </div>`;
    }

    document.getElementById('stats-content').innerHTML = html;
}

// ── Helpers ────────────────────────────────────────────────────────────────

function esc(str) {
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

function fmt_mem(bytes) {
    if (!bytes) return '—';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function clearOutput() {
    document.getElementById('placeholder').style.display = '';
    document.getElementById('output-content').innerHTML = '';
    document.getElementById('stdout-content').innerHTML = '<span class="out-empty">No output yet.</span>';
    document.getElementById('stderr-content').innerHTML = '<span class="out-empty">No stderr yet.</span>';
    document.getElementById('stats-content').innerHTML = '<span class="out-empty">Run code to see execution stats.</span>';
    document.getElementById('badge-stderr').classList.remove('show');
    document.getElementById('badge-stdout').classList.remove('show');
}

function showApiError(msg) {
    document.getElementById('placeholder').style.display = 'none';
    document.getElementById('output-content').innerHTML = `<div class="err-block">${esc(msg)}</div>`;
}

function setStatus(lang, msg, state = 'default') {
    const bar = document.getElementById('statusbar');
    bar.className = 'statusbar' + (state !== 'default' ? ` ${state}` : '');
    document.getElementById('sb-lang').textContent = `⚡ ${lang}`;
    document.getElementById('sb-msg').textContent = msg;
}

// ── Event Listeners ────────────────────────────────────────────────────────

document.getElementById('lang-select').addEventListener('change', onLangChange);

document.getElementById('run-btn').addEventListener('click', runCode);

document.getElementById('stdin-toggle').addEventListener('click', () => {
    const panel = document.getElementById('input-panel');
    const btn = document.getElementById('stdin-toggle');
    panel.classList.toggle('open');
    btn.classList.toggle('active');
});

document.querySelectorAll('.out-tab').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.out-tab').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
    });
});
</script>
</body>
</html>
