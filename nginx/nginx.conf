# IP blocklist — abusive IPs that scrape or abuse the execute endpoint.
# Add one `deny <ip>;` per line. `allow all;` at the end lets everyone else through.
geo $blocked_ip {
    default         0;
    64.227.179.187  1;  # DigitalOcean bot hammering /api/v2/execute via axios
    94.154.46.244   1;  # credentials scanner (fake Googlebot, probing .env/wp-config)
}

# Rate limit zones
# Zone size: 1 MB holds ~16 000 IP state entries — 10m is plenty for 1000 students.
#
# CLASSROOM NAT WARNING: if all students are behind one NAT the $binary_remote_addr
# will be the same for everyone, collapsing 1000 students into one rate-limit bucket.
# Solution A (simple):  increase burst to accommodate the whole class from one IP.
# Solution B (correct): use a session cookie / X-Student-ID header as the key and
#                       set $limit_key from that in a map block above.
# The burst values below are tuned for Solution A — a single-IP school network.
#
# execute: 30 r/s burst 60 — a class of 30 students pressing Run simultaneously
#          fires ~30 requests; burst absorbs the spike and nodelay keeps latency low.
# connect: 10 r/s burst 20 — WS connection upgrades (one per student, rare events).
# terminal: 5 r/s burst 10 — terminal WebSocket upgrades.
limit_req_zone $binary_remote_addr zone=execute_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=connect_limit:10m rate=10r/s;

# Three Piston API replicas — nginx distributes load evenly (least connections)
upstream piston_backend {
    least_conn;
    server api1:2000;
    server api2:2000;
    server api3:2000;
    keepalive 64;
}

# ── Port 2001 — Internal API access for sql-backend (NO rate limiting) ───────
# sql-backend calls this port so its requests do NOT share the execute_limit
# bucket with student IDE requests. All sql-backend calls come from one
# container IP, so routing through port 2000 would exhaust burst=60 instantly.
# This port is not published to the host (no "2001:2001" in docker-compose).
server {
    listen 2001;
    server_name _;

    if ($blocked_ip) { return 403; }

    client_max_body_size 16m;

    location /api/v2/execute {
        proxy_pass http://piston_backend/api/v2/execute;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /api/ {
        proxy_pass http://piston_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        return 404 '{"message":"Not found"}';
        add_header Content-Type application/json;
    }
}

# ── Port 2000 — API-only access for developers / external UIs ────────────────
# Developers connect here: http://<vps-ip>:2000/api/v2/execute
# No frontend HTML is served on this port — pure API proxy only.
server {
    listen 2000;
    server_name _;

    if ($blocked_ip) { return 403; }

    client_max_body_size 2m;

    add_header X-Frame-Options        "SAMEORIGIN"                     always;
    add_header X-Content-Type-Options "nosniff"                        always;

    location /api/v2/connect {
        limit_req zone=connect_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://piston_backend/api/v2/connect;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /api/v2/execute {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type";
            add_header Access-Control-Max-Age       86400;
            return 204;
        }

        limit_req zone=execute_limit burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://piston_backend/api/v2/execute;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;

        add_header Access-Control-Allow-Origin  *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type";
    }

    location /api/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type";
            add_header Access-Control-Max-Age       86400;
            return 204;
        }

        proxy_pass http://piston_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;

        add_header Access-Control-Allow-Origin  *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type";
    }

    # ── SQL Studio backend (session-persistent SQLite via FastAPI + Redis) ───────
    location /sql-api/ {
        proxy_pass http://sql-backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 16m;   # allows up to 16 MB CSV/SQL uploads
    }

    location / {
        return 404 '{"message":"Not found — use /api/v2/"}';
        add_header Content-Type application/json;
    }
}

# ── Port 80 — Full stack (UI + API) ──────────────────────────────────────────
server {
    listen 80;
    server_name _;

    if ($blocked_ip) { return 403; }

    # M4: Explicit body size limit — prevents ambiguity across nginx versions
    client_max_body_size 2m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"                     always;
    add_header X-Content-Type-Options "nosniff"                        always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    # Restrict resource loading to same origin; allow Monaco/xterm from /vendor/
    # and the Piston API on the same host. Adjust script-src if adding CDN scripts.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; worker-src blob:; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:; img-src 'self' data:; font-src 'self' data:;" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;

    # ── SQL Studio backend ────────────────────────────────────────────────────
    location /sql-api/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type";
            return 204;
        }
        proxy_pass http://sql-backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 16m;
    }

    # ── Vendored offline libraries (Monaco, xterm.js) ─────────────────────────
    # Served from /usr/share/nginx/vendor/ which is baked into the image and
    # is NOT masked by the ./frontend bind-mount over /usr/share/nginx/html/.
    location /vendor/ {
        alias /usr/share/nginx/vendor/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Static frontend ────────────────────────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        location ~* \.(js|css|png|svg|ico|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── Interactive WebSocket (xterm.js live I/O) ──────────────────────────────
    location /api/v2/connect {
        limit_req zone=connect_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://piston_backend/api/v2/connect;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── Execute endpoint (rate-limited) ───────────────────────────────────────
    location /api/v2/execute {
        # Return CORS preflight immediately — don't forward OPTIONS to Piston
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type";
            add_header Access-Control-Max-Age       86400;
            return 204;
        }

        limit_req zone=execute_limit burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://piston_backend/api/v2/execute;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # C4: Must exceed compile_timeout (30 s) + run_timeout (120 s) + margin.
        # Previous value of 60 s caused 504 errors for any job running > 60 s.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;

        add_header Access-Control-Allow-Origin  *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type";
    }

    # ── All other API calls (runtimes, packages list) ──────────────────────────
    location /api/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type";
            add_header Access-Control-Max-Age       86400;
            return 204;
        }

        proxy_pass http://piston_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;

        add_header Access-Control-Allow-Origin  *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type";
    }
}
