# Rate limit zones (per student IP)
limit_req_zone $binary_remote_addr zone=execute_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=connect_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=terminal_limit:10m rate=2r/s;

# Three Piston API replicas — nginx distributes load evenly (least connections)
upstream piston_backend {
    least_conn;
    server api1:2000;
    server api2:2000;
    server api3:2000;
    keepalive 64;
}

server {
    listen 80;
    server_name _;

    # M4: Explicit body size limit — prevents ambiguity across nginx versions
    client_max_body_size 2m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"                     always;
    add_header X-Content-Type-Options "nosniff"                        always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── Vendored offline libraries (Monaco, xterm.js) ─────────────────────────
    # Served from /usr/share/nginx/vendor/ which is baked into the image and
    # is NOT masked by the ./frontend bind-mount over /usr/share/nginx/html/.
    location /vendor/ {
        alias /usr/share/nginx/vendor/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Static frontend ────────────────────────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        location ~* \.(js|css|png|svg|ico|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── Interactive WebSocket (xterm.js live I/O) ──────────────────────────────
    location /api/v2/connect {
        limit_req zone=connect_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://piston_backend/api/v2/connect;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── Execute endpoint (rate-limited) ───────────────────────────────────────
    location /api/v2/execute {
        # Return CORS preflight immediately — don't forward OPTIONS to Piston
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type";
            add_header Access-Control-Max-Age       86400;
            return 204;
        }

        limit_req zone=execute_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://piston_backend/api/v2/execute;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # C4: Must exceed compile_timeout (30 s) + run_timeout (120 s) + margin.
        # Previous value of 60 s caused 504 errors for any job running > 60 s.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;

        add_header Access-Control-Allow-Origin  *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type";
    }

    # ── Sandbox terminal WebSocket ─────────────────────────────────────────────
    location /terminal {
        limit_req zone=terminal_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://terminal-service:3000/terminal;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout  1800s;
        proxy_send_timeout  1800s;
    }

    # ── All other API calls (runtimes, packages list) ──────────────────────────
    location /api/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type";
            add_header Access-Control-Max-Age       86400;
            return 204;
        }

        proxy_pass http://piston_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;

        add_header Access-Control-Allow-Origin  *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type";
    }
}
