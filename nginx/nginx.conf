# Rate limit zones (per student IP)
limit_req_zone $binary_remote_addr zone=execute_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=connect_limit:10m rate=5r/s;

# Three Piston API replicas — nginx distributes load evenly (least connections)
upstream piston_backend {
    least_conn;
    server api1:2000;
    server api2:2000;
    server api3:2000;
    keepalive 64;
}

server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;

    # ── Static frontend ────────────────────────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        location ~* \.(js|css|png|svg|ico|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── Interactive WebSocket (xterm.js live I/O) ──────────────────────────────
    location /api/v2/connect {
        limit_req zone=connect_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://piston_backend/api/v2/connect;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── Execute endpoint (rate-limited) ───────────────────────────────────────
    location /api/v2/execute {
        limit_req zone=execute_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://piston_backend/api/v2/execute;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type";
    }

    # ── Sandbox terminal WebSocket ─────────────────────────────────────────────
    location /terminal {
        proxy_pass http://terminal-service:3000/terminal;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout  1800s;
        proxy_send_timeout  1800s;

        add_header Access-Control-Allow-Origin  *;
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Upgrade, Connection";
    }

    # ── Terminal service health/stats (useful for dev integrations) ────────────
    location /terminal-service/ {
        proxy_pass http://terminal-service:3000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # ── All other API calls (runtimes, packages list) ──────────────────────────
    location /api/ {
        proxy_pass http://piston_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type";
    }
}
