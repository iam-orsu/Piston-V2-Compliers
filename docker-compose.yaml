services:
    api:
        build:
            context: ./api
            dockerfile: Dockerfile.fix
        container_name: piston_api
        restart: always
        privileged: true
        ports:
            - "2000:2000"
        volumes:
            - piston-packages:/piston/packages
        tmpfs:
            - /tmp:exec
        networks:
            - piston-net
        healthcheck:
            test: ["CMD", "node", "-e", "require('http').get('http://localhost:2000/api/v2/runtimes', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 20s

    frontend:
        build:
            context: ./nginx
        container_name: piston_frontend
        restart: always
        ports:
            - "8080:80"
        volumes:
            - ./frontend:/usr/share/nginx/html:ro
        depends_on:
            api:
                condition: service_healthy
        networks:
            - piston-net
        healthcheck:
            test: ["CMD", "sh", "-c", "nc -z localhost 80 || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3

networks:
    piston-net:
        driver: bridge

volumes:
    piston-packages:
