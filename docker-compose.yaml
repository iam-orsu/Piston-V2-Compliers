x-api-base: &api-base
    build:
        context: ./api
        dockerfile: Dockerfile          # Use the fully-patched main Dockerfile (Node 20, all security fixes)
    restart: always
    # C7: Dropped blanket privileged:true — replaced with targeted Linux capabilities
    # isolate needs SYS_ADMIN for mount namespaces and cgroup subtree management.
    cap_add:
        - SYS_ADMIN
        - NET_ADMIN
    security_opt:
        - seccomp=unconfined            # isolate manages its own seccomp internally
        - apparmor=unconfined           # isolate manages its own AppArmor internally
    volumes:
        - piston-packages:/piston/packages
    tmpfs:
        - /tmp:exec
    networks:
        - piston-net
    healthcheck:
        test: ["CMD", "node", "-e", "require('http').get('http://localhost:2000/api/v2/runtimes', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
        interval: 15s
        timeout: 5s
        retries: 5
        start_period: 30s

services:
    # ── Replica 1 (port 2000 exposed for CLI/admin) ──────────────────────────
    api1:
        <<: *api-base
        container_name: piston_api_1
        ports:
            - "127.0.0.1:2000:2000"
        environment:
            PISTON_RUNNER_UID_MIN: "1001"
            PISTON_RUNNER_UID_MAX: "1500"
            PISTON_RUNNER_GID_MIN: "1001"
            PISTON_RUNNER_GID_MAX: "1500"
            PISTON_MAX_CONCURRENT_JOBS: "150"
            PISTON_RUN_MEMORY_LIMIT: "268435456"
            PISTON_COMPILE_MEMORY_LIMIT: "268435456"
            PISTON_RUN_TIMEOUT: "120000"
            PISTON_COMPILE_TIMEOUT: "30000"
            PISTON_RUN_CPU_TIME: "15000"
            PISTON_COMPILE_CPU_TIME: "30000"
            PISTON_OUTPUT_MAX_SIZE: "10240"

    # ── Replica 2 (internal only) ─────────────────────────────────────────────
    api2:
        <<: *api-base
        container_name: piston_api_2
        environment:
            PISTON_RUNNER_UID_MIN: "1501"
            PISTON_RUNNER_UID_MAX: "2000"
            PISTON_RUNNER_GID_MIN: "1501"
            PISTON_RUNNER_GID_MAX: "2000"
            PISTON_MAX_CONCURRENT_JOBS: "150"
            PISTON_RUN_MEMORY_LIMIT: "268435456"
            PISTON_COMPILE_MEMORY_LIMIT: "268435456"
            PISTON_RUN_TIMEOUT: "120000"
            PISTON_COMPILE_TIMEOUT: "30000"
            PISTON_RUN_CPU_TIME: "15000"
            PISTON_COMPILE_CPU_TIME: "30000"
            PISTON_OUTPUT_MAX_SIZE: "10240"

    # ── Replica 3 (internal only) ─────────────────────────────────────────────
    api3:
        <<: *api-base
        container_name: piston_api_3
        environment:
            PISTON_RUNNER_UID_MIN: "2001"
            PISTON_RUNNER_UID_MAX: "2500"
            PISTON_RUNNER_GID_MIN: "2001"
            PISTON_RUNNER_GID_MAX: "2500"
            PISTON_MAX_CONCURRENT_JOBS: "150"
            PISTON_RUN_MEMORY_LIMIT: "268435456"
            PISTON_COMPILE_MEMORY_LIMIT: "268435456"
            PISTON_RUN_TIMEOUT: "120000"
            PISTON_COMPILE_TIMEOUT: "30000"
            PISTON_RUN_CPU_TIME: "15000"
            PISTON_COMPILE_CPU_TIME: "30000"
            PISTON_OUTPUT_MAX_SIZE: "10240"

    # ── Sandbox Terminal Service (node-pty + WebSocket → Docker) ─────────────
    terminal-service:
        build:
            context: ./terminal-service
        container_name: piston_terminal
        restart: always
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
        environment:
            SANDBOX_IMAGE: piston-sandbox:latest
            IDLE_TIMEOUT_MS: "300000"
            MAX_LIFETIME_MS: "1800000"
            MAX_SESSIONS: "500"          # Scaled from 200 → 500 for 128 GB RAM host
            PORT: "3000"
        mem_limit: 4g                    # Scaled from 1g → 4g to safely manage 500 WS PTY streams
        networks:
            - piston-net
        healthcheck:
            test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
            interval: 15s
            timeout: 5s
            retries: 3
            start_period: 20s

    # ── Frontend (nginx load balancer + static files) ─────────────────────────
    frontend:
        build:
            context: ./nginx
        container_name: piston_frontend
        restart: always
        ports:
            - "8080:80"
        volumes:
            - ./frontend:/usr/share/nginx/html:ro
        depends_on:
            api1:
                condition: service_healthy
            terminal-service:
                condition: service_healthy
        networks:
            - piston-net
        healthcheck:
            test: ["CMD", "sh", "-c", "nc -z localhost 80 || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3

networks:
    piston-net:
        driver: bridge

volumes:
    piston-packages:
