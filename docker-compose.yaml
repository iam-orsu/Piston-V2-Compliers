x-api-base: &api-base
    build:
        context: ./api
        dockerfile: Dockerfile
    restart: always
    # privileged is required: isolate must create cgroup subtrees under
    # /sys/fs/cgroup/isolate/. Docker 20.10+ defaults to a private cgroup
    # namespace; compose v5 schema rejects cgroupns_mode. privileged implicitly
    # sets cgroupns=host — the only working path for isolate on cgroup v2.
    # Student code sandboxing is handled entirely by isolate; Docker privileged
    # only grants the ability to manage the container's own cgroup tree.
    privileged: true
    volumes:
        - piston-packages:/piston/packages
    tmpfs:
        - /tmp:exec
    networks:
        - piston-net
    healthcheck:
        test: ["CMD", "node", "-e", "require('http').get('http://localhost:2000/api/v2/runtimes', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
        interval: 15s
        timeout: 5s
        retries: 5
        start_period: 30s

# ── Memory budget for 128 GB RAM / 96 vCPU production host ─────────────────
#
#   Component                    Count   Per-unit    Total
#   ─────────────────────────────────────────────────────
#   OS + nginx + misc            —       ~4 GB       4 GB
#   API replicas (Node process)  3       ~1 GB       3 GB
#   API concurrent jobs          300     96 MB       ~28 GB
#   Terminal Node process        1       ~4 GB       4 GB
#   Terminal sandbox containers  1000    96 MB       ~94 GB  (theoretical max — in practice <500 concurrent)
#   ─────────────────────────────────────────────────────
#   Worst-case peak                                  ~133 GB  ← just over; realistic peak ~90 GB
#
#   The terminal sessions are never all active at once (students are typing, not running).
#   Reduce MAX_SESSIONS or per-container memory further on smaller hosts.

services:
    # ── Replica 1 (port 2000 exposed for CLI/admin) ──────────────────────────
    api1:
        <<: *api-base
        container_name: piston_api_1
        ports:
            - "127.0.0.1:2000:2000"
        # 100 concurrent jobs × 96 MB run limit = ~9.6 GB peak per replica.
        # 12g ceiling gives generous headroom for the Node process itself + compile jobs.
        mem_limit: ${PISTON_API_MEM_LIMIT:-12g}
        environment:
            PISTON_RUNNER_UID_MIN: "1001"
            PISTON_RUNNER_UID_MAX: "1500"
            PISTON_RUNNER_GID_MIN: "1001"
            PISTON_RUNNER_GID_MAX: "1500"
            PISTON_MAX_CONCURRENT_JOBS: "100"
            # 96 MB run limit: enough for Python/JS/Java classroom workloads.
            # Raise to 256 MB for C++/Rust heavy compilation on a bigger host.
            PISTON_RUN_MEMORY_LIMIT: "100663296"
            # 192 MB compile limit: GCC/Rust need more headroom during compilation.
            PISTON_COMPILE_MEMORY_LIMIT: "201326592"
            PISTON_RUN_TIMEOUT: "15000"
            PISTON_COMPILE_TIMEOUT: "30000"
            PISTON_RUN_CPU_TIME: "10000"
            PISTON_COMPILE_CPU_TIME: "30000"
            PISTON_OUTPUT_MAX_SIZE: "65536"

    # ── Replica 2 (internal only) ─────────────────────────────────────────────
    api2:
        <<: *api-base
        container_name: piston_api_2
        mem_limit: ${PISTON_API_MEM_LIMIT:-12g}
        environment:
            PISTON_RUNNER_UID_MIN: "1501"
            PISTON_RUNNER_UID_MAX: "2000"
            PISTON_RUNNER_GID_MIN: "1501"
            PISTON_RUNNER_GID_MAX: "2000"
            PISTON_MAX_CONCURRENT_JOBS: "100"
            PISTON_RUN_MEMORY_LIMIT: "100663296"
            PISTON_COMPILE_MEMORY_LIMIT: "201326592"
            PISTON_RUN_TIMEOUT: "15000"
            PISTON_COMPILE_TIMEOUT: "30000"
            PISTON_RUN_CPU_TIME: "10000"
            PISTON_COMPILE_CPU_TIME: "30000"
            PISTON_OUTPUT_MAX_SIZE: "65536"

    # ── Replica 3 (internal only) ─────────────────────────────────────────────
    api3:
        <<: *api-base
        container_name: piston_api_3
        mem_limit: ${PISTON_API_MEM_LIMIT:-12g}
        environment:
            PISTON_RUNNER_UID_MIN: "2001"
            PISTON_RUNNER_UID_MAX: "2500"
            PISTON_RUNNER_GID_MIN: "2001"
            PISTON_RUNNER_GID_MAX: "2500"
            PISTON_MAX_CONCURRENT_JOBS: "100"
            PISTON_RUN_MEMORY_LIMIT: "100663296"
            PISTON_COMPILE_MEMORY_LIMIT: "201326592"
            PISTON_RUN_TIMEOUT: "15000"
            PISTON_COMPILE_TIMEOUT: "30000"
            PISTON_RUN_CPU_TIME: "10000"
            PISTON_COMPILE_CPU_TIME: "30000"
            PISTON_OUTPUT_MAX_SIZE: "65536"

    # ── Sandbox Terminal Service (node-pty + WebSocket → Docker) ─────────────
    terminal-service:
        build:
            context: ./terminal-service
        container_name: piston_terminal
        restart: always
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
        environment:
            SANDBOX_IMAGE: piston-sandbox:latest
            IDLE_TIMEOUT_MS: "300000"
            MAX_LIFETIME_MS: "1800000"
            # 500 concurrent sessions at 96 MB each = ~47 GB. Safe under 128 GB
            # when API replicas are running at normal load. Raise to 1000 only if
            # terminal-service is the sole heavy workload on this host.
            MAX_SESSIONS: "500"
            PORT: "3000"
            NODE_OLD_SPACE_MB: "3584"
        mem_limit: ${TERMINAL_MEM_LIMIT:-4g}
        networks:
            - piston-net
        healthcheck:
            test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
            interval: 15s
            timeout: 5s
            retries: 3
            start_period: 20s

    # ── Frontend (nginx load balancer + static files) ─────────────────────────
    frontend:
        build:
            context: ./nginx
        container_name: piston_frontend
        restart: always
        ports:
            - "8080:80"
        volumes:
            - ./frontend:/usr/share/nginx/html:ro
        depends_on:
            api1:
                condition: service_healthy
            terminal-service:
                condition: service_healthy
        networks:
            - piston-net
        healthcheck:
            test: ["CMD", "sh", "-c", "nc -z localhost 80 || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3

networks:
    piston-net:
        driver: bridge

volumes:
    piston-packages:
