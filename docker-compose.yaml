# Production docker-compose — 3 Piston API replicas + nginx load balancer
#
# Before first run:
#   1. Copy .env.example to .env  →  cp .env.example .env
#   2. Create the packages directory  →  mkdir -p ./data/piston/packages
#   3. docker compose up -d
#      (kernel tunables are applied automatically by the 'host-init' service)
#
# Logs:    docker compose logs -f api1
# Install a package (run on any one replica):
#   docker compose exec api1 node /piston_api/src ppman install python 3.10.0

version: '3.8'

services:

  # ── Host kernel tuning (runs once, exits, never restarts) ────────────────────
  # A privileged container has direct access to the host's /proc/sys, so sysctl
  # writes here take effect on the real kernel — same as running them manually.
  # All API replicas depend on this completing before they start.
  host-init:
    image: busybox
    privileged: true
    restart: "no"
    command: >
      sh -c "
        sysctl -w kernel.pid_max=131072 &&
        sysctl -w fs.file-max=2000000 &&
        sysctl -w kernel.threads-max=131072 &&
        echo 'host-init: kernel tunables applied'
      "

  # ── API Replica 1 ────────────────────────────────────────────────────────────
  api1:
    build: api
    container_name: piston_api1
    hostname: api1
    restart: unless-stopped

    # privileged: required so isolate can create cgroup subtrees and mount
    # namespaces. cap_add alone is not enough — Docker's capability grants
    # don't cover all the kernel operations isolate needs.
    privileged: true
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined

    # Host cgroup namespace: the container sees and can write to the full
    # /sys/fs/cgroup tree. Docker 20.10+ defaults to private; must be explicit.
    cgroup: host
    cgroup_parent: piston-api1.slice

    mem_limit: ${PISTON_API_MEM_LIMIT:-42g}
    memswap_limit: ${PISTON_API_MEM_LIMIT:-42g}   # disable swap beyond mem_limit

    ulimits:
      # Max OS processes this container may create.
      # 256 jobs × 64 processes/job = 16384 minimum; 65536 gives generous headroom.
      nproc: 65536
      # File descriptors: 256 jobs × 2048 open files/job = 524288 minimum.
      nofile:
        soft: 1048576
        hard: 1048576

    sysctls:
      net.core.somaxconn: 65535

    volumes:
      - packages:/piston/packages

    environment:
      - PISTON_MAX_CONCURRENT_JOBS=256
      - PISTON_DISABLE_NETWORKING=true
      - PISTON_RUN_MEMORY_LIMIT=268435456      # 256 MB per job run stage
      - PISTON_COMPILE_MEMORY_LIMIT=536870912  # 512 MB per job compile stage
      - PISTON_RUN_TIMEOUT=30000             # 30s — time for students to type input
      - PISTON_COMPILE_TIMEOUT=30000         # 30s compile timeout
      - PISTON_MAX_PROCESS_COUNT=256         # JVM (Scala/Java) needs many GC threads
      # SQL Studio: sqlite3 .dump output can exceed the 64 KB default for any real
      # dataset. Truncated output means state capture fails silently → INSERTs don't
      # persist. 4 MB matches sql-backend's MAX_SEED_BYTES ceiling.
      - PISTON_OUTPUT_MAX_SIZE=4194304

    depends_on:
      host-init:
        condition: service_completed_successfully

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:2000/api/v2/health', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

    networks:
      - piston_net

  # ── API Replica 2 ────────────────────────────────────────────────────────────
  api2:
    build: api
    container_name: piston_api2
    hostname: api2
    restart: unless-stopped
    privileged: true
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    cgroup: host
    cgroup_parent: piston-api2.slice
    mem_limit: ${PISTON_API_MEM_LIMIT:-42g}
    memswap_limit: ${PISTON_API_MEM_LIMIT:-42g}
    ulimits:
      nproc: 65536
      nofile:
        soft: 1048576
        hard: 1048576
    sysctls:
      net.core.somaxconn: 65535
    volumes:
      - packages:/piston/packages
    environment:
      - PISTON_MAX_CONCURRENT_JOBS=256
      - PISTON_DISABLE_NETWORKING=true
      - PISTON_RUN_MEMORY_LIMIT=268435456
      - PISTON_COMPILE_MEMORY_LIMIT=536870912
      - PISTON_RUN_TIMEOUT=30000
      - PISTON_COMPILE_TIMEOUT=30000
      - PISTON_MAX_PROCESS_COUNT=256
      - PISTON_OUTPUT_MAX_SIZE=4194304
    depends_on:
      host-init:
        condition: service_completed_successfully

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:2000/api/v2/health', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - piston_net

  # ── API Replica 3 ────────────────────────────────────────────────────────────
  api3:
    build: api
    container_name: piston_api3
    hostname: api3
    restart: unless-stopped
    privileged: true
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    cgroup: host
    cgroup_parent: piston-api3.slice
    mem_limit: ${PISTON_API_MEM_LIMIT:-42g}
    memswap_limit: ${PISTON_API_MEM_LIMIT:-42g}
    ulimits:
      nproc: 65536
      nofile:
        soft: 1048576
        hard: 1048576
    sysctls:
      net.core.somaxconn: 65535
    volumes:
      - packages:/piston/packages
    environment:
      - PISTON_MAX_CONCURRENT_JOBS=256
      - PISTON_DISABLE_NETWORKING=true
      - PISTON_RUN_MEMORY_LIMIT=268435456
      - PISTON_COMPILE_MEMORY_LIMIT=536870912
      - PISTON_RUN_TIMEOUT=30000
      - PISTON_COMPILE_TIMEOUT=30000
      - PISTON_MAX_PROCESS_COUNT=256
      - PISTON_OUTPUT_MAX_SIZE=4194304
    depends_on:
      host-init:
        condition: service_completed_successfully

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:2000/api/v2/health', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - piston_net

  # ── Redis — SQL session state (INSERT/UPDATE/DELETE persist between runs) ───
  redis:
    image: redis:7-alpine
    container_name: piston_redis
    restart: unless-stopped
    # volatile-lru: evicts only keys with a TTL (session state), never config.
    # Under memory pressure it drops the least-recently-used session first —
    # a student who finished — rather than refusing all writes.
    command: redis-server --maxmemory 512mb --maxmemory-policy volatile-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - piston_net

  # ── SQL Backend — FastAPI that wraps Piston's sqlite3 runtime ───────────────
  # Each student gets an isolated SQLite session stored in Redis (1 h TTL).
  # The backend wraps every query with the session's .dump as seed SQL so
  # INSERT/UPDATE/DELETE survive between runs without modifying Piston at all.
  sql-backend:
    build: sql-backend
    container_name: piston_sql_backend
    restart: unless-stopped
    environment:
      # Port 2001 is the internal nginx listener with NO rate limiting — all
      # sql-backend requests share one container IP so port 2000's burst=60 bucket
      # would 429-reject every student query past the 60th simultaneous request.
      - PISTON_URL=http://nginx:2001
      - REDIS_URL=redis://redis:6379
      - SESSION_TTL=3600          # 1 h — session state auto-expires
      - MAX_SEED_BYTES=4194304    # 4 MB max stored state per session
      - EXECUTE_TIMEOUT=30        # wall-clock seconds per query
      - RUN_CPU_TIME=10           # CPU seconds per query
      - PISTON_LOG_PAYLOAD=false  # set true to debug query payloads
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - piston_net

  # ── nginx load balancer + frontend ──────────────────────────────────────────
  nginx:
    build: nginx
    container_name: piston_nginx
    restart: unless-stopped
    ports:
      - "80:80"      # UI + API  (for the built-in frontend)
      - "2000:2000"  # API only  (for developers / external UIs)
    volumes:
      # Frontend HTML is served from here. Edit frontend/index.html to update the UI.
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      host-init:
        condition: service_completed_successfully
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
      api3:
        condition: service_healthy
    networks:
      - piston_net

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  # Plain Docker named volume — Docker manages it on the Linux ext4 filesystem.
  # DO NOT use a bind-mount to the Windows/NTFS filesystem (e.g. /mnt/c/...) —
  # NTFS does not support utime/chmod, which causes tar to fail when extracting
  # language runtime packages. Named volumes work on both WSL2 and bare Linux.
  packages:

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  piston_net:
    driver: bridge
    # Increase the ARP and connection tables — needed when 768 concurrent job
    # containers all communicate through this bridge at peak load.
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "true"
